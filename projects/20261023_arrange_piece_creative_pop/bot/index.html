<body>
<div class="shell">
<header class="topbar"><div class="wordmark"><span class="brand-icon" aria-hidden="true">案</span><span class="brand-copy"><span id="brand">動画制作のご相談</span><span class="brand-status">株式会社アレンジピース・4問の自動ガイド</span></span></div><a class="guide-home" href="../">サービス紹介へ ↗</a></header>
<main id="main"><section id="hero" class="hero"><span class="eyebrow" id="eyebrow"></span><h1 id="hero-title"></h1><div class="intro-chat"><span class="avatar" aria-hidden="true">案</span><div class="bubble"><p id="hero-description"></p><span class="intro-caption">選択肢をタップすると、案内が届きます</span></div></div><div class="start-area"><p class="start-note" id="start-note"></p><button id="start" class="primary" type="button" disabled>読み込み中</button><p class="privacy">質問のあとに、ご連絡先を入力できます</p></div><p id="demo-note" class="demo-note" hidden>架空サービスの体験デモ</p></section>
<section id="chat" hidden aria-label="選択式の自動ガイド"><div class="progress-bar"><div class="progress-copy"><span id="progress-label"></span><button type="button" id="back" class="text-button">ひとつ戻る</button></div><div id="progress" role="progressbar" aria-label="質問の回答進捗" aria-valuemin="0" aria-valuemax="3" aria-valuenow="0"><span id="progress-fill"></span></div></div><div id="transcript"></div><p id="status" class="sr-only" role="status" aria-live="polite"></p><button id="latest" type="button" class="latest" hidden>最新の質問へ</button></section>
<section id="error" hidden role="alert"><h1>ページを表示できませんでした</h1><p>リンクを確認して、もう一度お試しください。</p><a href="./">制作ガイドの最初へ戻る</a></section></main>

</div><aside id="sticky" class="sticky" hidden aria-label="お問い合わせフォームへのご案内"></aside>
