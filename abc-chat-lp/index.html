<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="description" content="選択肢をタップして、気になるサービスの確認ポイントを知るチャットガイド。">
<title>電気代の見直しガイド</title>
<link rel="icon" href="./favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="./style.css?build=c8cc3de842fe">
<!-- Add an approved GTM container here. No pixels or external analytics are loaded by default. -->
<script>window.dataLayer = window.dataLayer || [];</script>
<script type="module" src="./app.js?build=c8cc3de842fe"></script>
</head>
<body>
<div class="shell">
<header class="topbar"><div class="wordmark"><span class="brand-icon" aria-hidden="true">電</span><span class="brand-copy"><span id="brand">くらしの電気ガイド</span><span class="brand-status">選択式の自動ガイド</span></span></div><span class="ad-label">PR</span></header>
<main id="main"><section id="hero" class="hero"><span class="eyebrow" id="eyebrow"></span><h1 id="hero-title"></h1><div class="intro-chat"><span class="avatar" aria-hidden="true">案</span><div class="bubble"><p id="hero-description"></p><span class="intro-caption">選択肢をタップすると、案内が届きます</span></div></div><div class="start-area"><p class="start-note" id="start-note"></p><button id="start" class="primary" type="button" disabled>読み込み中</button><p class="privacy">氏名・電話番号などの入力はありません</p></div><p id="demo-note" class="demo-note" hidden>架空サービスの体験デモ</p></section>
<section id="chat" hidden aria-label="選択式の自動ガイド"><div class="progress-bar"><div class="progress-copy"><span id="progress-label"></span><button type="button" id="back" class="text-button">ひとつ戻る</button></div><div id="progress" role="progressbar" aria-label="質問の回答進捗" aria-valuemin="0" aria-valuemax="3" aria-valuenow="0"><span id="progress-fill"></span></div></div><div id="transcript"></div><p id="status" class="sr-only" role="status" aria-live="polite"></p><button id="latest" type="button" class="latest" hidden>最新の質問へ</button></section>
<section id="error" hidden role="alert"><h1>ページを表示できませんでした</h1><p>リンクを確認して、もう一度お試しください。</p><a href="./">デモの最初へ戻る</a></section></main>
<footer>選択式の自動ガイドです。<br>リアルタイムの有人チャットではありません。</footer>
</div><aside id="sticky" class="sticky" hidden aria-label="公式ページへのご案内"></aside>
<noscript><p class="noscript">このガイドにはJavaScriptが必要です。ブラウザで有効にして再読み込みしてください。</p></noscript>
</body></html>
