<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
<title>2つの治療を同時に受けると、長茎術10万円が10万円OFFで実質0円。一緒に受けるもう1つの治療費は別途かかります。</title>
<defs><linearGradient id="gold" x2="0.8" y2="1"><stop stop-color="#fff5c4"/><stop offset=".45" stop-color="#ebc563"/><stop offset="1" stop-color="#fff1be"/></linearGradient><linearGradient id="dark" x2="0" y2="1"><stop stop-color="#19372a"/><stop offset="1" stop-color="#0c2218"/></linearGradient></defs>
<rect x="3" y="3" width="794" height="594" rx="25" fill="url(#dark)" stroke="#d4b368" stroke-width="6"/>
<g font-family="Hiragino Kaku Gothic ProN,Meiryo,sans-serif" text-anchor="middle" font-weight="700">
<rect x="152" y="34" width="496" height="56" rx="28" fill="url(#gold)"/>
<text x="400" y="73" fill="#243124" font-size="29">治療に使えるLINEクーポン</text>
<text x="400" y="147" fill="#fff8df" font-size="32">2つの治療を同時に受けると</text>
<text x="400" y="215" fill="#fff" font-size="49">長茎術 10万円</text>
<path d="M265 195H535" stroke="#d2b66b" stroke-width="3"/>
<text x="400" y="280" fill="#f1d683" font-size="52">10万円OFF</text>
<path d="M379 295H421L400 317Z" fill="#d9bd75"/>
<text x="400" y="365" fill="#fff4c9" font-size="41">長茎術が</text>
<text x="400" y="460" fill="url(#gold)" font-size="100" letter-spacing="-5">実質0円</text>
<path d="M52 490H748" stroke="#b99b56"/>
<text x="400" y="535" fill="#e8eadf" font-size="23" font-weight="400">一緒に受けるもう1つの治療費は</text>
<text x="400" y="568" fill="#e8eadf" font-size="23" font-weight="400">別途かかります。</text>
</g></svg>
