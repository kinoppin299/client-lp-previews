<rect x="455" y="451" width="237" height="42" rx="7" fill="#e6f1eb"/><text x="574" y="480" font-size="23" text-anchor="middle" fill="#235647" font-weight="700">自宅の個別レポート</text>
<text x="456" y="533" font-size="25" fill="#234c40">✓ 補助金の目安</text><text x="456" y="580" font-size="25" fill="#234c40">✓ 屋根の設置容量</text><text x="456" y="627" font-size="25" fill="#234c40">✓ 年間発電量の目安</text>
<rect x="40" y="708" width="700" height="113" rx="18" fill="#145d49"/>
<text x="390" y="755" text-anchor="middle" font-size="35" fill="white" font-weight="800">まずは、無料レポートから。</text><text x="390" y="795" text-anchor="middle" font-size="26" fill="#e5f2df">自宅の数字を見てから、家族で検討</text></g></svg>
