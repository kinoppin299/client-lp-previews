<svg xmlns="http://www.w3.org/2000/svg" width="780" height="860" viewBox="0 0 780 860" role="img"><title>太陽光と蓄電池は高いから無理、と決める前に。東京都の戸建て持ち家向け、うちの補助金はいくら？無料の個別レポートで補助金・設置容量・年間発電量の目安を確認。</title><g font-family="Hiragino Kaku Gothic ProN,Meiryo,sans-serif"><defs><linearGradient id="bg" x2="0.9" y2="1"><stop stop-color="#fcf7e6"/><stop offset="1" stop-color="#e4f2e9"/></linearGradient></defs>
<rect width="780" height="860" fill="url(#bg)"/>
<rect x="40" y="32" width="535" height="52" rx="26" fill="#145d49"/><text x="307" y="67" text-anchor="middle" font-size="27" fill="white" font-weight="700">東京都の戸建て持ち家の方へ</text>
<text x="44" y="148" font-size="33" fill="#245348" font-weight="700">太陽光＋蓄電池</text>
<text x="40" y="219" font-size="57" fill="#193d34" font-weight="800">「高いから無理」</text>
<text x="44" y="277" font-size="38" fill="#193d34" font-weight="700">と、決める前に。</text>
<rect x="40" y="307" width="700" height="91" rx="14" fill="#ffe492"/>
<text x="390" y="371" text-anchor="middle" font-size="58" fill="#145d49" font-weight="800">うちの補助金、いくら？</text>
