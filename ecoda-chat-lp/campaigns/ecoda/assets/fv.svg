<path d="M111 500l107-64 106 66-106 25Z" fill="#294c67"/><path d="M144 480l105 36m-72-55 106 42m-95-50-23 60m65-53-16 59m54-36-10 24" stroke="#8fa9c1" stroke-width="3"/>
