<rect x="351" y="572" width="64" height="105" rx="9" fill="#f8fbf8" stroke="#235647" stroke-width="4"/><rect x="362" y="584" width="42" height="8" rx="4" fill="#9ebbac"/><path d="m386 602-15 24h13l-7 24 19-29h-14Z" fill="#e9b53f"/><path d="M363 663h40" stroke="#9ebbac" stroke-width="3"/>
