<svg xmlns="http://www.w3.org/2000/svg" width="780" height="430" viewBox="0 0 780 430" role="img"><title>令和8年度東京都蓄電池助成の基本単価は1kWhあたり10万円。対象経費が上限、DR実証不参加の場合上限120万円毎戸。自宅の受給額の判定ではありません。</title><g font-family="Hiragino Kaku Gothic ProN,Meiryo,sans-serif"><rect width="780" height="430" rx="18" fill="#fffdf5"/><rect x="0" width="780" height="12" fill="#c99a3e"/>
<text x="390" y="68" text-anchor="middle" font-size="34" fill="#174c3e" font-weight="800">設備の値段だけで、あきらめない。</text>
<rect x="38" y="103" width="704" height="171" rx="14" fill="#e7f2eb"/><text x="390" y="149" text-anchor="middle" font-size="29" fill="#285948">東京都の蓄電池助成の基本単価</text><text x="390" y="235" text-anchor="middle" font-size="68" fill="#145d49" font-weight="800">1kWhあたり10万円</text>
<text x="39" y="315" font-size="23" fill="#42534c">※令和8年度。対象経費が上限。</text><text x="39" y="352" font-size="23" fill="#42534c">DR実証不参加の場合、上限120万円／戸。</text><text x="39" y="391" font-size="22" fill="#42534c">出典：クール・ネット東京。個別の受給額ではありません。</text></g></svg>